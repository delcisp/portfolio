  <line x1="34.5" y1="21" x2="29.5" y2="46" stroke="#F5F5F5" stroke-width="3.2" stroke-linecap="round"/>
  <!-- antenas -->
  <path d="M34.5 21 Q33 14.5 28.5 12" fill="none" stroke="#F5F5F5" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M34.5 21 Q36.5 14.5 41 12.5" fill="none" stroke="#F5F5F5" stroke-width="1.8" stroke-linecap="round"/>
